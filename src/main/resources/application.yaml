spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW}
    show-sql: ${SPRING_JPA_SHOW_SQL}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
    locations: ${SPRING_FLYWAY_LOCATIONS}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED}

  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

  default-admin:
    email: ${APP_DEFAULT_ADMIN_EMAIL}
    password: ${APP_DEFAULT_ADMIN_PASSWORD}
    phone: ${APP_DEFAULT_ADMIN_PHONE}

  company:
    name: ${APP_COMPANY_NAME}
    address: ${APP_COMPANY_ADDRESS}